name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-production
  cancel-in-progress: false
env:
  ASTRO_TELEMETRY_DISABLED: '1'
  PUBLIC_PREVIEW: 'false'
jobs:
  build:
    if: github.repository == 'WizardLoop/wizardloop.github.io' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browsers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-quality-results
          path: artifacts/final/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated static artifact
        id: deployment
        uses: actions/deploy-pages@v4
