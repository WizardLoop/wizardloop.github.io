name: Quality checks
on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browsers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-quality-results
          path: artifacts/final/
          retention-days: 7
